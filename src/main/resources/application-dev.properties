# ------------------- APPLICATION NAME -------------------
spring.application.name=springBootProjectStarter
# Sets the name of your application specifically for the dev environment
# Useful for logs, monitoring, or if you run multiple apps locally

# ------------------- DATABASE CONNECTION (DEV) -------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/CRUD_Dev
# The JDBC URL points to a local development database "CRUD_Dev"
# This is different from the main CRUD DB used in production
# Ensures you don?t mix test/dev data with production data

spring.datasource.username=postgres
spring.datasource.password=spring
# Credentials for connecting to your local dev database
# These match the PostgreSQL setup on your local machine

spring.datasource.driver-class-name=org.postgresql.Driver
# Tells Spring Boot which JDBC driver to use to connect to PostgreSQL
# Spring Boot can usually auto-detect this but explicit is safer

# ------------------- JPA / HIBERNATE SETTINGS -------------------
spring.jpa.hibernate.ddl-auto=update
# Tells Hibernate to automatically create/update database tables based on entities
# In dev, this is convenient: DB schema updates automatically
# ?? In production, NEVER use 'update' ? can lose data or cause conflicts
# Other options: none, validate, create, create-drop

spring.jpa.show-sql=true
# Prints SQL statements to console/log
# Very useful in development to debug queries and see what Hibernate executes

spring.jpa.open-in-view=false
# Same as main: disables lazy-loading outside transactions
# Forces you to fetch all required data inside service layer
# Helps catch N+1 query problems early

# ------------------- BASIC SPRING SECURITY DEV USER -------------------
spring.security.user.name=dev
spring.security.user.password=dev
spring.security.user.roles=USER
# Provides a simple in-memory user for dev authentication
# Useful to test endpoints secured with Spring Security
# Username: dev, Password: dev, Role: USER
# ?? Only for development, never use hardcoded credentials in production