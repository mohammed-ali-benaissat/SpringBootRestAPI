# ================================
# STEPS / NOTES FOR PROMOTING DEV DB TO PROD
# ================================

# 1. Export your dev database schema only (no data)
#    pg_dump -U postgres -h localhost -d CRUD_Dev -s > schema.sql
#    -s = schema only

# 2. Review schema.sql
#    - Remove any test data or dev-specific info
#    - Confirm table names, columns, primary/foreign keys

# 3. Apply schema to production DB
#    psql -U postgres -h localhost -d CRUD -f schema.sql
#    - This will create all tables, constraints, and indexes in prod

# 4. Set Spring Boot to use the prod profile
#    Option A: edit application.properties
#       spring.profiles.active=prod
#    Option B: pass profile on command line
#       ./mvnw spring-boot:run -Dspring-boot.run.profiles=prod
#       or
#       java -jar your-app.jar --spring.profiles.active=prod

# 5. Test API endpoints on production to ensure everything works:
#    GET /users
#    GET /profile
#    POST /users
#    - Check for errors like table missing or column mismatch

# 6. Optional: Use Flyway or Liquibase for future schema migrations
#    - Store schema changes in versioned SQL files
#    - Spring Boot will apply changes automatically in order
#    - Example folder: src/main/resources/db/migration/
#      V1__create_user_profile_tables.sql
#      V2__add_orders_table.sql