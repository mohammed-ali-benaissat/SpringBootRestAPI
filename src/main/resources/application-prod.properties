# ------------------- JPA / HIBERNATE SETTINGS (PRODUCTION) -------------------

spring.jpa.hibernate.ddl-auto=validate
# In production, Hibernate will only validate that the database schema matches your entities
# It will NOT create or update tables automatically
# Why? To prevent accidental data loss or schema changes in production
# If validation fails (e.g., missing column), the app will fail to start ? alerts you to fix schema manually

spring.jpa.show-sql=false
# Do NOT log SQL statements in production
# Helps keep logs clean and prevents sensitive data from appearing in logs

spring.jpa.open-in-view=false
# Same as dev: disables lazy-loading outside transactions
# Forces you to fetch all data needed in service layer
# Prevents N+1 query problems and memory leaks in production





