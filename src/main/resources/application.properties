# ------------------- APPLICATION NAME -------------------
spring.application.name=springBootProjectStarter
# This sets the name of your application.
# Useful for logging, monitoring, or if you deploy multiple apps to same infrastructure.
# Example: logs can show "springBootProjectStarter" instead of a generic name.

# ------------------- ACTIVE SPRING PROFILE -------------------
spring.profiles.default=dev
# Spring Boot supports multiple environments via "profiles"
# Common profiles: dev, test, prod
# Here "dev" is the default profile ? your app will load dev-specific configurations
# Example: in dev you might allow Swagger, but in prod you might disable it for security

# ------------------- DATABASE CONNECTION -------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CRUD}
# The JDBC URL to connect to your PostgreSQL database
# Using ${DB_URL:...} allows you to override via environment variable DB_URL
# If DB_URL is not set, it defaults to jdbc:postgresql://localhost:5432/CRUD

spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:spring}
# Same as above: these use environment variables first, then fall back to defaults
# Username: postgres
# Password: spring
# This is important for local dev vs deployed servers

spring.datasource.driver-class-name=org.postgresql.Driver
# Tells Spring which JDBC driver to use to connect to PostgreSQL
# Spring Boot can usually auto-detect this, but specifying it is more explicit

# ------------------- JPA / HIBERNATE -------------------
spring.jpa.open-in-view=false
# By default, Spring Boot keeps the Hibernate session open during web requests
# This allows lazy-loaded relationships (e.g., user.getOrders()) to work outside transaction
# Setting open-in-view=false is recommended for production ? avoids N+1 query problem & memory leaks
# Means: all lazy data must be loaded within the service method transaction